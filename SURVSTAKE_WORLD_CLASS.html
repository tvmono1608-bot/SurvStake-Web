<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurvStake Elite | World Class Marketing</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap');

        :root {
            --gold: #FFC107;
            --black: #050505;
            --dark-gray: #0f0f0f;
            --accent: #FFD54F;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--black);
            color: white;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* ESCENA PRINCIPAL */
        .marketing-scene {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #050505 100%);
            position: relative;
        }

        /* RED DE LÁSER INFERIOR (GRID 3D) */
        .perspective-grid {
            position: absolute;
            bottom: -100px;
            width: 200%;
            height: 600px;
            background-image:
                linear-gradient(var(--gold) 1px, transparent 1px),
                linear-gradient(90deg, var(--gold) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.1;
            transform: perspective(500px) rotateX(60deg);
            animation: grid-move 20s linear infinite;
        }

        @keyframes grid-move {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 0 600px;
            }
        }

        /* LÁSER DE ESCANEO VERTICAL */
        .scan-beam {
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 193, 7, 0.2), transparent);
            transform: skewX(-20deg);
            animation: scan-move 4s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes scan-move {
            0% {
                left: -100%;
            }

            100% {
                left: 200%;
            }
        }

        /* TARJETA CENTRAL PREMIUM */
        .elite-card {
            background: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 193, 7, 0.4);
            border-radius: 40px;
            padding: 100px 60px;
            width: 90%;
            max-width: 1100px;
            text-align: center;
            position: relative;
            z-index: 10;
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.8);
            animation: card-float 6s ease-in-out infinite;
        }

        @keyframes card-float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        /* CONTENIDO TEXTUAL */
        .badge {
            color: var(--gold);
            border: 2px solid var(--gold);
            padding: 8px 25px;
            border-radius: 100px;
            font-weight: 700;
            letter-spacing: 6px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(40px, 8vw, 90px);
            font-weight: 900;
            line-height: 0.85;
            text-transform: uppercase;
            letter-spacing: -3px;
            margin-bottom: 30px;
        }

        h1 span {
            color: var(--gold);
            display: block;
            position: relative;
            text-shadow: 0 0 30px rgba(255, 193, 7, 0.5);
        }

        p {
            font-size: clamp(16px, 2vw, 24px);
            color: #aaa;
            max-width: 700px;
            margin: 0 auto 50px;
            line-height: 1.5;
            font-weight: 300;
        }

        /* BOTONES DE ACCIÓN */
        .actions {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-premium {
            background: var(--gold);
            color: black;
            text-decoration: none;
            padding: 22px 50px;
            border-radius: 16px;
            font-weight: 900;
            font-size: 20px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-premium:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px rgba(255, 193, 7, 0.6);
            background: #fff;
        }

        .btn-outline {
            background: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 20px 40px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 700;
            font-size: 18px;
            transition: 0.3s;
        }

        .btn-outline:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        /* FOOTER BRANDING */
        .footer-brand {
            margin-top: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            opacity: 0.4;
        }

        .footer-brand div {
            font-size: 12px;
            letter-spacing: 4px;
            font-weight: 700;
        }

        /* PARTÍCULAS DE POLVO/DATOS */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div class="marketing-scene">
        <div class="perspective-grid"></div>
        <div class="scan-beam"></div>

        <div class="elite-card">
            <div class="badge">World Class Engineering</div>

            <h1>
                LA CIENCIA DE LA
                <span>PERFECCIÓN</span>
            </h1>

            <p>
                No solo medimos terreno, creamos el gemelo digital de tus ambiciones. SurvStake: Tecnología LiDAR y
                Topografía de nivel avanzado.
            </p>

            <div class="actions">
                <a href="https://tvmono1608-bot.github.io/SurvStake-Web/" class="btn-premium">
                    EXPLORAR SITIO OFICIAL →
                </a>
                <a href="https://wa.me/573178623774" class="btn-outline">
                    WHATSAPP DIRECTO
                </a>
            </div>

            <div class="footer-brand">
                <div>INGENIERÍA VIAL</div>
                <div>FOTOGRAMETRÍA</div>
                <div>LIDAR</div>
                <div>GEODESIA</div>
            </div>
        </div>
    </div>

</body>

</html>
